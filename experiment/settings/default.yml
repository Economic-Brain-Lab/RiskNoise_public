task:
  n_trials: 20 #(6*4)
  n_repetitions: 2
  n_runs: 15
  # probabilities: [.07, .14, .28, .56]
  payoffs: [5, 8, 13, 21, 34]
  probabilities: [.07]
  # payoffs: [5]
  show_prob_during_payoff: False
  budget: 40

window:
  size: [2560, 1440]
  # size: [1470, 956] # MacBook Air
  pos: [0.0, 0]
  color: [0, 0, 0]
  fullscr: False
  units: deg
  winType: pyglet
  screen: 0
  viewPos: [0, 0]
  colorSpace: rgb
  waitBlanking: True

monitor:
  name: default
  width: 60
  # width: 29.1 # MacBook Air
  distance: 56  # in cm
  gamma: 1

mri:
  simulate: False
  TR: 2.0  # seconds between volume acquisitions
  sync: t  # character used as flag for sync timing, default=‘5’
  n_dummy_scans: 0

cloud:
  aperture_radius: 2.5
  dot_radius: .1
  stimulus_series: False

slider:
  max_length: 15
  range: [0.0, 40]
  borderColor: [-1, -1, -1]
  color: [.5, .5, .5]
  feedbackColor: [1., 1., -1]
  height: 1.5
  borderWidth: .1
  markerColor: [.25, .25, .25]
  text_height: .5
  range_proportion: 0.1
  n_discrete_steps: 4

various:
  text_width: 40
  text_height: .5
  text_color: [1, 1, 1]
  text_align: left
  line_spacing: 1.25

durations:
  first_fixation: 0.4 
  second_fixation: 0.5
  array_duration: 0.6
  isi: [1., 1., 1.]
  response_screen: 5.0
  feedback: 0.5
  cue_trials: 2.

fixation_lines:
  lineWidth: 2
  center_fixation_size: 0.25
  # whether a circle should be drawn around dot aperture
  draw_circle: False
  # whether teh fixation cross should extend to the edge of display
  draw_outer_cross: False

prob_cue:
  fixation_size: 1.0
  cue_size: 1.0

mouse:
  visible: False

interface:
  mouse_multiplier: 2.