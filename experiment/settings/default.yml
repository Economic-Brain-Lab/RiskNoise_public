task:
  # n_trials: 20 #(6*4)
  n_reps: 2
  n_runs: 12
  probabilities: [.07, .14, .28, .56]
  payoffs: [5, 8, 13, 21, 34]
  show_prob_during_payoff: False
  budget: 40

window:
  size: [1920, 1080]
  # size: [2560, 1440] # QBI-333
  # size: [1470, 956] # MacBook Air
  pos: [0.0, 0]
  color: [0, 0, 0]
  fullscr: True
  units: deg
  winType: pyglet
  screen: 0
  viewPos: [0, 0]
  colorSpace: rgb
  waitBlanking: True

monitor:
  name: default
  width: 70
  # width: 60
  # width: 29.1 # MacBook Air
  distance: 56  # in cm
  gamma: 1

mri:
  simulate: False
  TR: 2.0  # seconds between volume acquisitions
  sync: t  # character used as flag for sync timing, default=‘5’
  n_dummy_scans: 0

cloud:
  aperture_radius: 2.5
  dot_radius: .1
  stimulus_series: False

slider:
  max_length: 15
  range: [0.0, 40]
  borderColor: [-1, -1, -1]
  color: [.5, .5, .5]
  feedbackColor: [1., 1., -1]
  height: 1.5
  borderWidth: .1
  markerColor: [.25, .25, .25]
  text_height: .5
  range_proportion: 0.1
  n_discrete_steps: 4

various:
  text_width: 40
  text_height: .5
  text_color: [1, 1, 1]
  text_align: left

durations:
  first_fixation: 0.4 
  second_fixation: 0.5
  array_duration: 0.6
  isi: [1., 1., 1.]
  iti: [0.5, 1.0, 1.5]  # inter-trial interval (can be a list for random selection)
  # response deadline, null if no deadline
  response_screen: 5
  feedback: 0.5
  cue_trials: 2.

# should the code wait for input before proceeding to next display
wait_for_input:
  fixation1: false
  prob_cue: false
  stimulus: false
  jitter: false
  response: false
  response1: false  # For two-sliders trial type
  response2: false  # For two-sliders trial type
  feedback: false
  feedback1: false  # For two-stage trial type
  feedback2: false  # For two-stage trial type

fixation_lines:
  lineWidth: 2
  center_fixation_size: 0.25
  # whether a circle should be drawn around dot aperture
  draw_circle: False
  # whether teh fixation cross should extend to the edge of display
  draw_outer_cross: False

prob_cue:
  fixation_size: .5
  cue_size: 2

mouse:
  visible: False

interface:
  mouse_multiplier: 2.

eyetracker:
  model: eyelink
  CNUM: 5
  MIN_CALIB_FIX: 1000
  options:
    active_eye: RIGHT
    sample_rate: 500
    calibration_type: HV5
    calibration_area_proportion: 0.75 0.75
    calibration_area_proportion: 0.6 0.6 